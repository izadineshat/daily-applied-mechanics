name: Daily Applied Mechanics Script

on:
  schedule:
    # اجرا هر روز ساعت ۰۴:۰۰ صبح به وقت UTC (قابل تنظیم)
    - cron: '0 4 * * *'
  workflow_dispatch: # امکان اجرای دستی با یک دکمه در گیت‌هاب

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai numpy scipy matplotlib

      - name: Run Script Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_daily_code.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(mech): auto-generate daily code $(date +'%Y-%m-%d')" && git push)
